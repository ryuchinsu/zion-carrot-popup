
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="시온성 당근 나눔행사">
  <title>시온성 당근</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Malgun Gothic", sans-serif;
      background: #FFF9F0;
      color: #333;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 25px;
      background: #fff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .logo {
      font-size: 38px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 29px;
      color: #D97706;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 25px;
      color: #444;
    }

    .message {
      font-size: 16px;
      line-height: 1.9;
      word-break: keep-all;
      color: #555;
    }

    .thanks {
      margin-top: 30px;
      padding: 20px 10px;
      background: #FFF7E9;
      border-radius: 12px;
      color: #B66A16;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.7;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- ==========================================
       기존 시온성 당근 서비스 (iframe)
       행사 종료에 따라 임시 비활성화
       필요 시 주석 해제하여 복구
  ===========================================

  <iframe
    src="https://script.google.com/macros/s/AKfycbzM1swZo_Mi_yHA4QPKwrlb6mG7bDFdk3liFozauIk3xxfW4qr7x33E3YI4f9MYCzo6rg/exec"
    title="시온성 당근"
    allow="fullscreen"
    allowfullscreen
    style="position:fixed; inset:0; width:100%; height:100%; border:0;">
  </iframe>

  =========================================== -->


  <!-- ==========================================
       행사 종료 안내 화면
  =========================================== -->

  <main class="container">

    <div class="logo">🥕</div>

    <h1>시온성 당근</h1>

    <h2>나눔행사가 종료되었습니다.</h2>

    <div class="message">
      시온성 당근 나눔행사가<br>
      은혜 가운데 잘 마무리되었습니다.
      <br><br>
      물품을 기증하고 나눔에 참여해 주신 모든 분과
      행사 준비 및 진행에 수고해 주신 분들께
      진심으로 감사드립니다.
    </div>

    <div class="thanks">
      여러분의 따뜻한 나눔에<br>
      감사드립니다.
    </div>

    <div class="footer">
      시온성교회
    </div>

  </main>

</body>
</html>
